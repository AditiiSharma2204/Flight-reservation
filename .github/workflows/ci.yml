name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Build (warnings as errors)
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -O2 flight.cpp -o flight ${{ runner.os == 'Windows' && '-static' || '' }}
      - name: Smoke test
        run: sh tests/smoke_test.sh ./flight

  web-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
